name: iSudoku
options:
  bundleIdPrefix: com.vidi
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: S769436W24
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  iSudoku-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iSudoku
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "iSudoku"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iSudoku
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  iSudoku-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iSudoku
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: "iSudoku"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: "public.app-category.puzzle-games"
        NSHumanReadableCopyright: "Copyright © 2026 David Arsénio Martins"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iSudoku
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
